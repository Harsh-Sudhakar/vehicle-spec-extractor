[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specx"
version = "1.0.0"
description = "Retrieval-augmented extraction of vehicle specifications from service manual PDFs"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
specx = "specx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
